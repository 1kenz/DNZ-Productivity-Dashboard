services:
  productivity-dashboard:
    container_name: i-kenz-dashboard-v3
    build: .
    image: localhost:5001/productivity-dashboard:v3.0
    ports:
      - "9999:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/productivity_dashboard
    restart: unless-stopped
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: productivity_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: productivity_dashboard
    ports:
      - "5532:5432"
    volumes:
      - productivity_dashboard_data:/var/lib/postgresql/data
    restart: always

volumes:
  productivity_dashboard_data:
    name: productivity-dashboardv25_postgres_data
    external: true
